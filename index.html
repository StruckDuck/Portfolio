<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua Stacy — Design & Fabrication Portfolio</title>
<style>
  :root {
    --ink: #1a1a1a;
    --gray: #555;
    --rule: #ddd;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 24px 24px;
  }
  h1 {
    font-size: 1.8rem;
    margin: 0 0 4px;
    font-weight: 700;
  }
  .subtitle {
    color: var(--gray);
    font-size: 1.05rem;
    margin: 0 0 20px;
  }
  .actions {
    display: flex;
    gap: 12px;
    margin-bottom: 8px;
  }
  a.button {
    display: inline-block;
    padding: 10px 18px;
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    font-size: 0.95rem;
  }
  a.button.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--rule);
  }
  .viewer-wrap {
    max-width: 900px;
    margin: 0 auto 48px;
    padding: 0 24px;
  }
  .viewer {
    width: 100%;
    height: 85vh;
    border: 1px solid var(--rule);
    border-radius: 6px;
  }
  footer {
    text-align: center;
    color: var(--gray);
    font-size: 0.85rem;
    padding: 24px;
  }
</style>
</head>
<body>
  <header>
    <h1>Joshua Stacy</h1>
    <p class="subtitle">Graphic Design, Illustration &amp; Fabrication Portfolio</p>
    <div class="actions">
      <a class="button" href="portfolio.pdf" download>Download PDF</a>
      <a class="button secondary" href="portfolio.pdf" target="_blank" rel="noopener">Open in New Tab</a>
    </div>
  </header>
  <div class="viewer-wrap">
    <iframe class="viewer" src="portfolio.pdf" title="Joshua Stacy Portfolio"></iframe>
  </div>
  <footer>
    joshuarstacy@gmail.com &nbsp;·&nbsp; (479) 510-3304
  </footer>
</body>
</html>
